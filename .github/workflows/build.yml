name: Build

on:
  pull_request:
    paths-ignore: ['**.md', '.gitignore']
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore']
  workflow_dispatch:

# Never cancel a publishing run; PR builds are fair game.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  APP_ID: org.gnome.Fractal
  # Same ref as Flathub, so this is a drop-in origin.
  BRANCH: stable
  RUNTIME_REPO: https://dl.flathub.org/repo/flathub.flatpakrepo

jobs:
  build:
    runs-on: ubuntu-latest
    # Flathub's own build image. Ubuntu's flatpak-builder is 1.4.2, which
    # changes meson's default libdir to lib64 and leaves shumate-1.0.pc off
    # pkg-config's path. This image carries 1.4.9, plus jq, gh, eu-strip and
    # the GNOME 50 Platform and SDK.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    permissions:
      contents: write        # attach the bundle to a release
    outputs:
      version: ${{ steps.version.outputs.version }}
    # The image has no /usr/bin/bash, so GitHub falls back to `sh`, which
    # breaks bashisms like ${GITHUB_SHA:0:7}. bash is present on PATH.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The workspace is owned by a different uid than the container's root,
      # and gh shells out to git to identify the repository.
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image ships the base SDK only; flatpak-builder does not install a
      # manifest's sdk-extensions itself.
      # See https://github.com/flatpak/flatpak-github-actions/issues/220
      # The branch is 25.08, not 50: org.gnome.Sdk//50 declares
      # `version = 25.08` on its org.freedesktop.Sdk.Extension point.
      - name: Install the Rust SDK extension
        run: |
          flatpak install -y --noninteractive flathub \
              org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Read the Fractal version being built
        id: version
        run: |
          # `tag` lives on the module's git source, not on the module.
          version=$(jq -r '[.modules[] | select(.name == "fractal") | .sources[]
                           | select((type == "object") and (.type == "git")) | .tag]
                          | first' \
                      "$APP_ID.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Fractal $version"

      # Only publishing runs need the key, so PRs from forks never touch it.
      - name: Import the signing key
        if: github.event_name == 'push'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --homedir "$GNUPGHOME" --batch --quiet --import
          fpr=$(gpg --homedir "$GNUPGHOME" --list-secret-keys --with-colons \
                  | awk -F: '/^fpr:/{print $10; exit}')
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_FINGERPRINT=$fpr" >> "$GITHUB_ENV"
          echo "Signing with $fpr"

      - name: Build
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean \
              --default-branch="$BRANCH" \
              ${GPG_FINGERPRINT:+--gpg-sign="$GPG_FINGERPRINT"} \
              --repo=repo \
              build-dir "$APP_ID.json"

      - name: Bundle
        run: |
          flatpak build-bundle repo fractal-tray.flatpak \
              "$APP_ID" "$BRANCH" \
              --runtime-repo="$RUNTIME_REPO" \
              ${GPG_FINGERPRINT:+--gpg-sign="$GPG_FINGERPRINT"}
          ls -lh fractal-tray.flatpak

      # Latest commit only: Pages caps a published site at 1 GB and each
      # commit is ~320 MB. Rollback is served by the release bundles.
      - name: Finalise the repository
        if: github.event_name == 'push'
        run: |
          flatpak build-update-repo \
              --prune --prune-depth=0 \
              --gpg-sign="$GPG_FINGERPRINT" \
              repo
          du -sh repo

      # A .flatpakref, not a .flatpakrepo, so installing sets the remote up as a
      # filtered origin: flatpak gives it xa.noenumerate=true, xa.prio=0 and
      # xa.main-ref, so it can never offer anything but this one ref and never
      # wins a dependency search. Deliberately no SuggestRemoteName: setting it
      # diverts flatpak to creating a plain enumerable remote instead, losing
      # the filter. RuntimeRepo is required because a no-enumerate remote is
      # skipped when resolving the runtime.
      - name: Write the flatpakref
        if: github.event_name == 'push'
        run: |
          cat > "repo/$APP_ID.flatpakref" <<EOF
          [Flatpak Ref]
          Version=1
          Name=$APP_ID
          Branch=$BRANCH
          Title=Fractal (Tray)
          Url=https://ramcq.github.io/fractal-tray/
          Homepage=https://github.com/ramcq/fractal-tray
          Comment=Unofficial Fractal rebuild with a system tray icon
          Description=Unofficial rebuild of the Fractal Matrix client with a StatusNotifierItem tray icon. Not affiliated with the Fractal project or GNOME.
          RuntimeRepo=$RUNTIME_REPO
          GPGKey=$(base64 --wrap=0 < fractal-tray.gpg)
          EOF
          sed 's/^GPGKey=.\{0,24\}.*/GPGKey=<base64>/' "repo/$APP_ID.flatpakref"
          # Stop Pages' Jekyll from eating the ostree directories.
          touch repo/.nojekyll

      - name: Upload the Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Publish the bundle as a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          gh release create --repo "$GITHUB_REPOSITORY" "$tag" fractal-tray.flatpak \
            --title "Fractal $VERSION (tray)" \
            --notes "Unofficial rebuild of Fractal $VERSION with a system tray icon.

          Install and track updates (one command, adds a filtered origin remote):

              flatpak install --user https://ramcq.github.io/fractal-tray/org.gnome.Fractal.flatpakref

          Or install this bundle directly, without a remote and so without updates:

              flatpak install --user fractal-tray.flatpak

          Not affiliated with the Fractal project or GNOME."

          # Keep the five most recent bundles.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r old; do
                [ -n "$old" ] && gh release delete --repo "$GITHUB_REPOSITORY" "$old" --yes --cleanup-tag
              done

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
