name: Probe
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          . /etc/os-release; echo "== $PRETTY_NAME =="
          apt-get download --print-uris flatpak-builder 2>/dev/null | head -1 || true
          apt-cache policy flatpak-builder flatpak | grep -E "^(flatpak|  Candidate)" 
          echo "-- disk --"; df -h / | tail -1
